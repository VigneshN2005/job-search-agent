name: Evaluate agent

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated case ids (empty runs all)"
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run evaluation
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m evals.run_eval --only ${{ github.event.inputs.only }}
          else
            python -m evals.run_eval
          fi
      - name: Report
        if: always()
        run: cat evals/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/RESULTS.md
            evals/results/*.json
